<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spine Web Player - Mouse Tracking</title>
    <!-- Spine Player JS/CSS (버전은 본인의 Spine 파일 버전에 맞춰 수정 가능) -->
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.1/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1/dist/spine-player.js"></script>
    <style>
        body { margin: 0; background: #222; }
        #player-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="player-container"></div>

<script>
    let mouseX = 0;
    let mouseY = 0;

    // 마우스 좌표 추적
    window.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    new spine.SpinePlayer("player-container", {
        jsonUrl: "Pulse_Irelia.json",
        atlasUrl: "Pulse_Irelia.atlas",
        animation: "animation", // 실제 파일 내 애니메이션 이름으로 변경하세요
        premultipliedAlpha: true,
        backgroundColor: "#222222",
        showControls: true,
        
        success: function (player) {
            const skeleton = player.skeleton;
            // 이미지에서 확인된 'Head_Ctrl' 본을 찾습니다.
            const headBone = skeleton.findBone("Head_Ctrl");

            player.onUpdate = (delta) => {
                if (headBone) {
                    // 플레이어 컨테이너 내 상대 좌표 계산
                    const rect = player.canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // 마우스 위치와 캐릭터 중심 사이의 거리 계산 (민감도 조절 필요)
                    // Spine 좌표계는 Y축이 위로 향하므로 부호를 뒤집습니다.
                    const targetX = (mouseX - centerX) * 0.5; 
                    const targetY = -(mouseY - centerY) * 0.5;

                    // 본의 위치를 마우스 방향으로 업데이트 (Override)
                    headBone.x = targetX;
                    headBone.y = targetY;
                }
            };
        }
    });
</script>

</body>
</html>

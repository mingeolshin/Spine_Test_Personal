<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2.43 - Fixed</title>
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.43/dist/iife/spine-player.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.43/dist/spine-player.css">
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="player-container"></div>

<script>
    let headBone;
    let targetX = 0, targetY = 0;

    window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth) * 2 - 1;
        targetY = (e.clientY / window.innerHeight) * 2 - 1;
    });

    new spine.SpinePlayer("player-container", {
        // 최신 버전에서 URL 인식을 위해 jsonUrl 사용
        jsonUrl: "Pulse_Irelia.json", 
        atlasUrl: "Pulse_Irelia.atlas",
        animation: "animation",
        premultipliedAlpha: true,
        backgroundColor: "#00000000",
        alpha: true,
        showControls: false,
        success: (player) => {
            headBone = player.skeleton.findBone("Head_Ctrl");
        },
        update: (player, delta) => {
            if (headBone) {
                const power = 200; // 팍팍 움직이게!
                headBone.x = targetX * power;
                headBone.y = -targetY * power;
            }
        }
    });
</script>

</body>
</html>

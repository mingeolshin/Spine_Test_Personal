<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spine Player - Pulse Irelia</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <script>
        let mouseX = 0;
        let mouseY = 0;

        // 마우스 좌표 실시간 업데이트
        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        new spine.SpinePlayer("player-container", {
            jsonUrl: "Pulse_Irelia.json",
            atlasUrl: "Pulse_Irelia.atlas",
            animation: "animation",
            premultipliedAlpha: true,
            backgroundColor: "#00000000",
            showControls: true, // 다시 컨트롤러 보이게 설정
            success: function (player) {
                const skeleton = player.skeleton;
                const headBone = skeleton.findBone("Head_Ctrl");

                if (!headBone) {
                    console.error("Head_Ctrl 본을 찾을 수 없습니다.");
                    return;
                }

                // 설정값 (움직임이 작으면 sensitivity를 1.0 이상으로 올리세요)
                const config = {
                    sensitivity: 2.0, 
                    lerpSpeed: 0.1    // 부드러운 정도
                };

                let currentX = 0;
                let currentY = 0;

                // Spine Player의 내부 로직 직후에 실행되는 업데이트 루프
                player.onUpdate = function (delta) {
                    const rect = player.canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // 마우스 목표치 계산
                    const targetX = (mouseX - centerX) * config.sensitivity;
                    const targetY = -(mouseY - centerY) * config.sensitivity;

                    // 부드러운 이동 (Lerp)
                    currentX += (targetX - currentX) * config.lerpSpeed;
                    currentY += (targetY - currentY) * config.lerpSpeed;

                    // [핵심] 애니메이션을 완전히 덮어쓰기 (Override)
                    // 애니메이션 키프레임이 0으로 돌려놓아도 여기서 다시 고정합니다.
                    headBone.x = currentX;
                    headBone.y = currentY;
                };
            }
        });
    </script>
</body>
</html>

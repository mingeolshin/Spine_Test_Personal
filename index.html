<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2.43 - Mouse Control</title>
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.43/dist/iife/spine-player.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.43/dist/spine-player.css">
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="player-container"></div>

<script>
    let headBone;
    let mouseX = 0;
    let mouseY = 0;

    // 마우스 좌표 업데이트
    window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    });

    new spine.SpinePlayer("player-container", {
        jsonUrl: "Pulse_Irelia.json",
        atlasUrl: "Pulse_Irelia.atlas",
        animation: "animation",
        premultipliedAlpha: true,
        showControls: true,  // UI 열기
        alpha: true,
        backgroundColor: "#000000",
        success: (player) => {
            headBone = player.skeleton.findBone("Head_Ctrl");
        },
        // update 함수에서 본의 위치를 강제로 고정
        update: (player, delta) => {
            if (headBone) {
                const moveScale = 10000; // 더 팍팍 움직이게 300으로 상향
                
                // 마우스 위치 대입
                headBone.x = mouseX * moveScale;
                headBone.y = -mouseY * moveScale;
                
                // 중요: 애니메이션이 본을 매번 초기 위치로 돌려놓지 못하게 
                // 해당 본의 위치를 수동으로 업데이트했다고 선언합니다.
                headBone.update(); 
            }
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spine Player - Pulse Irelia</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
    <style>
        /* UI 실종 방지를 위한 절대 좌표 설정 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
        #player-container { 
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh; 
        }
        /* 플레이어 내부 UI 요소들이 캔버스 뒤로 숨지 않게 강제 설정 */
        .spine-player { background: transparent !important; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <script>
        let mX = 0, mY = 0;

        window.addEventListener("mousemove", (e) => {
            mX = e.clientX;
            mY = e.clientY;
        });

        new spine.SpinePlayer("player-container", {
            jsonUrl: "Pulse_Irelia.json",
            atlasUrl: "Pulse_Irelia.atlas",
            animation: "animation",
            premultipliedAlpha: true,
            backgroundColor: "#00000000",
            showControls: true, // UI 무조건 표시
            success: function (player) {
                const skeleton = player.skeleton;
                const head = skeleton.findBone("Head_Ctrl");

                if (!head) {
                    console.error("Head_Ctrl 본을 찾을 수 없습니다.");
                    return;
                }

                // 플레이어의 그리기 루프에 직접 개입
                player.onUpdate = function (delta) {
                    const rect = player.canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // 1. 마우스 좌표 1:1 계산
                    const targetX = mX - centerX;
                    const targetY = -(mY - centerY);

                    // 2. 강제 좌표 대입 (Override)
                    head.x = targetX;
                    head.y = targetY;

                    // 3. [중요] 좌표 변경 후 즉시 월드 트랜스폼 업데이트
                    // 이걸 안 하면 애니메이션이 계산된 후의 결과로 렌더링되어 머리가 멈춰 보입니다.
                    skeleton.updateWorldTransform();
                };
            }
        });
    </script>
</body>
</html>

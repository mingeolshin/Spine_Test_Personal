<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>내 스파인 시연 페이지</title>
    <!-- 1. 스파인 플레이어 필수 라이브러리 로드 -->
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
    <style>
        body { background: #222; margin: 0; }
        #player-container { width: 100%; height: 100vh; } /* 화면 꽉 차게 설정 */
    </style>
</head>
<body>

    <!-- 2. 캐릭터가 나타날 공간 -->
    <div id="player-container"></div>

    <script>
        new spine.SpinePlayer("player-container", {
            jsonUrl: "character.json", // 본인 파일명으로 수정
            atlasUrl: "character.atlas", // 본인 파일명으로 수정
            animation: "idle", // 처음 재생할 애니메이션 이름
            backgroundColor: "#00000000", // 배경 투명하게
            premultipliedAlpha: true,
            showControls: true, // 하단 컨트롤바 표시 (애니메이션 선택 가능)
        });
    </script>
</body>
</html>

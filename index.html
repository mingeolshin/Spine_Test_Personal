<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spine Player - Pulse Irelia</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <script>
        new spine.SpinePlayer("player-container", {
            jsonUrl: "Pulse_Irelia.json", 
            atlasUrl: "Pulse_Irelia.atlas",
            animation: "animation", 
            premultipliedAlpha: true,
            backgroundColor: "#00000000",
            showControls: true,
            success: function (player) {
                const headBone = player.skeleton.findBone("Head_Ctrl");
                
                if (!headBone) {
                    console.warn("Head_Ctrl 뼈대를 찾을 수 없습니다.");
                    return;
                }

                let isDragging = false;
                // 드래그 강도 및 범위 설정
                const config = {
                    sensitivity: 0.7,    // 움직임 강도 (숫자가 클수록 많이 움직임)
                    maxDistance: 200,    // 최대 가동 범위 (픽셀)
                    returnSpeed: 0.1     // 제자리로 돌아오는 속도
                };

                let targetX = 0;
                let targetY = 0;

                // 클릭 시작
                window.addEventListener("mousedown", (e) => { if(e.button === 0) isDragging = true; });
                // 클릭 해제
                window.addEventListener("mouseup", () => { isDragging = false; });

                window.addEventListener("mousemove", (e) => {
                    if (!isDragging) return;

                    const rect = player.canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // 마우스 위치 계산
                    let x = (e.clientX - centerX) * config.sensitivity;
                    let y = -(e.clientY - centerY) * config.sensitivity;

                    // 범위 제한 (Clamp)
                    const distance = Math.sqrt(x * x + y * y);
                    if (distance > config.maxDistance) {
                        const ratio = config.maxDistance / distance;
                        x *= ratio;
                        y *= ratio;
                    }

                    targetX = x;
                    targetY = y;
                    
                    // 즉시 반영
                    headBone.x = targetX;
                    headBone.y = targetY;
                });

                // 매 프레임마다 실행되는 루프 (드래그 안 할 때 복귀용)
                player.onUpdate = function() {
                    if (!isDragging) {
                        // 서서히 0,0 위치로 복귀
                        headBone.x += (0 - headBone.x) * config.returnSpeed;
                        headBone.y += (0 - headBone.y) * config.returnSpeed;
                    }
                };
            }
        });
    </script>
</body>
</html>
